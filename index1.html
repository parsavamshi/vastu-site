<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vishwakarma Vastu Sciences | Dr. KL Vishwakarma</title>
    
    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-orange: #ff8c00;
            --dark-orange: #e67e00;
        }

        body {
            font-family: 'Inter', sans-serif;
        }

        /* Navbar */
        .navbar {
            transition: all 0.4s ease;
            background: rgba(255, 140, 0, 0.95) !important;
            backdrop-filter: blur(10px);
        }

        .navbar.scrolled {
            background: rgba(230, 126, 0, 0.98) !important;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            padding: 0.6rem 0 !important;
        }

        /* Custom Navbar Toggler - Default: Lines (Hamburger) */
        .navbar-toggler {
            border: none;
            padding: 10px;
            background: transparent;
            outline: none;
        }

        .navbar-toggler:focus {
            box-shadow: none;
        }

        .navbar-toggler-icon {
            width: 28px;
            height: 24px;
            position: relative;
            display: inline-block;
        }

        /* Three Lines (Default State) */
        .navbar-toggler-icon::before,
        .navbar-toggler-icon::after,
        .navbar-toggler-icon .middle-line {
            content: '';
            position: absolute;
            width: 100%;
            height: 3px;
            background: white;
            border-radius: 2px;
            transition: all 0.4s ease;
        }

        .navbar-toggler-icon::before { top: 0; }
        .navbar-toggler-icon .middle-line { top: 50%; transform: translateY(-50%); }
        .navbar-toggler-icon::after { bottom: 0; }

        /* When Menu is OPEN - Change to Close Icon (X) */
        .navbar-toggler[aria-expanded="true"] .navbar-toggler-icon::before,
        .navbar-toggler[aria-expanded="true"] .navbar-toggler-icon::after,
        .navbar-toggler[aria-expanded="true"] .navbar-toggler-icon .middle-line {
            background: white;
        }

        .navbar-toggler[aria-expanded="true"] .navbar-toggler-icon::before {
            transform: rotate(45deg) translate(6px, 6px);
        }

        .navbar-toggler[aria-expanded="true"] .navbar-toggler-icon .middle-line {
            opacity: 0;
        }

        .navbar-toggler[aria-expanded="true"] .navbar-toggler-icon::after {
            transform: rotate(-45deg) translate(6px, -6px);
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.6)), 
                        url('https://picsum.photos/id/1015/1920/1080') center/cover no-repeat;
            height: 100vh;
            min-height: 650px;
            display: flex;
            align-items: center;
            color: white;
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            color: #e67e00;
            position: relative;
            display: inline-block;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 4px;
            background: linear-gradient(to right, #ff8c00, #f1c40f);
        }

        /* Floating Follow Button */
        .follow-btn-container {
            position: fixed;
            right: 25px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 1050;
        }

        .follow-btn {
            width: 62px;
            height: 62px;
            background: linear-gradient(135deg, #ff8c00, #e67e00);
            color: white;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 10px 30px rgba(230, 126, 0, 0.4);
            cursor: pointer;
            transition: all 0.4s ease;
        }

        .social-icons {
            position: absolute;
            right: 85px;
            top: 50%;
            transform: translateY(-50%);
            display: none;
            flex-direction: column;
            gap: 12px;
            opacity: 0;
            transition: all 0.4s ease;
        }

        .social-icons.show {
            display: flex;
            opacity: 1;
        }

        .social-icons a {
            width: 48px;
            height: 48px;
            background: white;
            color: #e67e00;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 1.4rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body data-bs-spy="scroll" data-bs-target="#mainNavbar">

    <!-- Navbar -->
    <nav id="mainNavbar" class="navbar navbar-expand-lg fixed-top navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4 d-flex align-items-center" href="#">
                <i class="fas fa-compass me-2"></i> Vishwakarma Vastu
            </a>
            
            <!-- Toggle Button - Default shows lines -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" 
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon">
                    <span class="middle-line"></span>
                </span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link px-4" href="#home">Home</a></li>
                    <li class="nav-item"><a class="nav-link px-4" href="#about">About</a></li>
                    <li class="nav-item"><a class="nav-link px-4" href="#services">Services</a></li>
                    <li class="nav-item"><a class="nav-link px-4" href="#healing">Healing</a></li>
                    <li class="nav-item"><a class="nav-link px-4" href="#publications">Publications</a></li>
                    <li class="nav-item"><a class="nav-link px-4" href="#faq">FAQ</a></li>
                    <li class="nav-item ms-3">
                        <a href="#" class="btn btn-light px-4 rounded-pill fw-semibold">Book Consultation</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section id="home" class="hero text-center">
        <div class="container">
            <h1 class="display-3 fw-bold mb-3">Vastuyogi KL Vishwakarma</h1>
            <p class="lead fs-3 mb-4">40+ Years of Authentic Vastu & Life Guidance</p>
            <a href="#services" class="btn btn-warning btn-lg px-5 py-3 rounded-pill">Explore Our Services</a>
        </div>
    </section>

    <!-- Floating Follow Button -->
    <div class="follow-btn-container">
        <button id="followBtn" class="follow-btn">
            <i class="fas fa-heart"></i>
        </button>
        
        <div id="socialIcons" class="social-icons">
            <a href="#"><i class="fab fa-facebook-f"></i></a>
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-youtube"></i></a>
            <a href="#"><i class="fab fa-whatsapp"></i></a>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Navbar scroll effect
        window.addEventListener('scroll', () => {
            const navbar = document.getElementById('mainNavbar');
            navbar.classList.toggle('scrolled', window.scrollY > 80);
        });

        // Auto close mobile menu when clicking a link
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', () => {
                const navbarCollapse = document.getElementById('navbarNav');
                if (window.innerWidth < 992) {
                    const bsCollapse = bootstrap.Collapse.getInstance(navbarCollapse);
                    if (bsCollapse) bsCollapse.hide();
                }
            });
        });

        // Floating Follow Button with Social Icons
        const followBtn = document.getElementById('followBtn');
        const socialIcons = document.getElementById('socialIcons');
        let isOpen = false;

        followBtn.addEventListener('click', () => {
            isOpen = !isOpen;
            if (isOpen) {
                socialIcons.classList.add('show');
                followBtn.innerHTML = '<i class="fas fa-times"></i>';
            } else {
                socialIcons.classList.remove('show');
                followBtn.innerHTML = '<i class="fas fa-heart"></i>';
            }
        });

        // Close social icons when clicking outside
        document.addEventListener('click', (e) => {
            if (!followBtn.contains(e.target) && !socialIcons.contains(e.target) && isOpen) {
                isOpen = false;
                socialIcons.classList.remove('show');
                followBtn.innerHTML = '<i class="fas fa-heart"></i>';
            }
        });

        console.log('%c✅ Navbar Toggle Fixed - Default shows lines only!', 'color: #ff8c00; font-weight: bold;');
    </script>
</body>
</html>
